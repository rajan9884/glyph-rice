# ── Glyph / Nothing OS — yazi theme ──────────────────────────────────────────
# Black bg · white text · single red accent (#D71921) · no color noise
# Palette (matches Theme.qml glyphDark):
#   bg=#000000  s1=#0E0E0E  s2=#1A1A1A  s3=#2A2A2A
#   mute=#4A4A4A  grey=#8C8C8C  fg=#F2F2F2  red=#D71921

# ── Manager ───────────────────────────────────────────────────────────────────
[mgr]
cwd             = { fg = "#8C8C8C" }

hovered         = { fg = "#F2F2F2", bg = "#1A1A1A", bold = true }
preview_hovered = { underline = true }

find_keyword    = { fg = "#D71921", bold = true }
find_position   = { fg = "#D71921", italic = true }

marker_selected = { fg = "#D71921", bg = "#D71921" }
marker_copied   = { fg = "#8C8C8C", bg = "#8C8C8C" }
marker_cut      = { fg = "#4A4A4A", bg = "#4A4A4A" }

count_selected  = { fg = "#000000", bg = "#D71921", bold = true }
count_copied    = { fg = "#000000", bg = "#8C8C8C" }
count_cut       = { fg = "#000000", bg = "#4A4A4A" }

border_symbol   = "│"
border_style    = { fg = "#2A2A2A" }

# ── Status bar ────────────────────────────────────────────────────────────────
[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#1A1A1A", bg = "#1A1A1A" }

mode_normal     = { fg = "#000000", bg = "#F2F2F2", bold = true }
mode_select     = { fg = "#000000", bg = "#D71921", bold = true }
mode_unset      = { fg = "#000000", bg = "#4A4A4A", bold = true }

progress_label  = { fg = "#F2F2F2", bold = true }
progress_normal = { fg = "#D71921", bg = "#2A2A2A" }
progress_error  = { fg = "#D71921", bg = "#2A2A2A" }

perm_type       = { fg = "#8C8C8C" }
perm_read       = { fg = "#F2F2F2" }
perm_write      = { fg = "#D71921" }
perm_exec       = { fg = "#8C8C8C" }
perm_sep        = { fg = "#2A2A2A" }

# ── Input box ─────────────────────────────────────────────────────────────────
[input]
cursor          = { fg = "#000000", bg = "#F2F2F2" }
title           = { fg = "#F2F2F2", bold = true }
value           = { fg = "#F2F2F2" }
selected        = { reversed = true }

# ── Tasks panel ───────────────────────────────────────────────────────────────
[tasks]
border          = { fg = "#2A2A2A" }
title           = { fg = "#F2F2F2", bold = true }
hovered         = { fg = "#F2F2F2", bg = "#1A1A1A", underline = true }

# ── Which-key popup ───────────────────────────────────────────────────────────
[which]
mask            = { bg = "#000000" }
cand            = { fg = "#F2F2F2" }
rest            = { fg = "#4A4A4A" }
desc            = { fg = "#8C8C8C" }
separator       = "  "
separator_style = { fg = "#2A2A2A" }

# ── Notify popups ─────────────────────────────────────────────────────────────
[notify]
title_info      = { fg = "#F2F2F2", bold = true }
title_warn      = { fg = "#8C8C8C", bold = true }
title_error     = { fg = "#D71921", bold = true }

# ── Help overlay ──────────────────────────────────────────────────────────────
[help]
on              = { fg = "#D71921", bold = true }
exec            = { fg = "#F2F2F2" }
desc            = { fg = "#8C8C8C" }
hovered         = { fg = "#F2F2F2", bg = "#1A1A1A", bold = true }
footer          = { fg = "#4A4A4A", bg = "#000000" }

# ── File type coloring ────────────────────────────────────────────────────────
# `rules` replaces all built-in filetype rules completely.
[filetype]
rules = [
    { mime = "inode/directory",             fg = "#F2F2F2", bold = true  },
    { mime = "inode/symlink",               fg = "#4A4A4A", italic = true },
    { mime = "image/*",                     fg = "#8C8C8C" },
    { mime = "audio/*",                     fg = "#8C8C8C" },
    { mime = "video/*",                     fg = "#8C8C8C" },
    { mime = "application/zip",             fg = "#4A4A4A", bold = true },
    { mime = "application/x-tar",           fg = "#4A4A4A", bold = true },
    { mime = "application/gzip",            fg = "#4A4A4A", bold = true },
    { mime = "application/x-bzip2",         fg = "#4A4A4A", bold = true },
    { mime = "application/x-xz",            fg = "#4A4A4A", bold = true },
    { mime = "application/x-7z-compressed", fg = "#4A4A4A", bold = true },
    { mime = "application/x-rar",           fg = "#4A4A4A", bold = true },
    { mime = "application/zstd",            fg = "#4A4A4A", bold = true },
    { mime = "application/pdf",             fg = "#8C8C8C" },
    { mime = "text/*",                      fg = "#F2F2F2" },
    { mime = "*",                           fg = "#8C8C8C" },
]

# ── Icons ─────────────────────────────────────────────────────────────────────
# Clear ALL built-in icon tables first, then define only ours.
# This prevents yazi's nvim-web-devicons colored defaults from bleeding through.
[icon]
globs = []
dirs  = []
files = []
exts  = []
conds = []

prepend_rules = [
    # Directories — white
    { name = "*/",     text = " ", fg = "#F2F2F2" },

    # Dotfiles — dim
    { name = ".*",     text = " ", fg = "#4A4A4A" },

    # Code
    { ext = "rs",      text = " ", fg = "#8C8C8C" },
    { ext = "py",      text = " ", fg = "#8C8C8C" },
    { ext = "js",      text = " ", fg = "#8C8C8C" },
    { ext = "ts",      text = " ", fg = "#8C8C8C" },
    { ext = "lua",     text = " ", fg = "#8C8C8C" },
    { ext = "sh",      text = " ", fg = "#8C8C8C" },
    { ext = "bash",    text = " ", fg = "#8C8C8C" },
    { ext = "zsh",     text = " ", fg = "#8C8C8C" },
    { ext = "toml",    text = " ", fg = "#8C8C8C" },
    { ext = "json",    text = " ", fg = "#8C8C8C" },
    { ext = "yaml",    text = " ", fg = "#8C8C8C" },
    { ext = "yml",     text = " ", fg = "#8C8C8C" },
    { ext = "md",      text = " ", fg = "#8C8C8C" },
    { ext = "txt",     text = " ", fg = "#8C8C8C" },

    # Documents
    { ext = "pdf",     text = " ", fg = "#8C8C8C" },

    # Archives — dim bold handled by filetype; icon dim
    { ext = "zip",     text = " ", fg = "#4A4A4A" },
    { ext = "tar",     text = " ", fg = "#4A4A4A" },
    { ext = "gz",      text = " ", fg = "#4A4A4A" },
    { ext = "xz",      text = " ", fg = "#4A4A4A" },
    { ext = "zst",     text = " ", fg = "#4A4A4A" },
    { ext = "7z",      text = " ", fg = "#4A4A4A" },
    { ext = "rar",     text = " ", fg = "#4A4A4A" },

    # Images
    { ext = "png",     text = " ", fg = "#8C8C8C" },
    { ext = "jpg",     text = " ", fg = "#8C8C8C" },
    { ext = "jpeg",    text = " ", fg = "#8C8C8C" },
    { ext = "gif",     text = " ", fg = "#8C8C8C" },
    { ext = "svg",     text = " ", fg = "#8C8C8C" },
    { ext = "webp",    text = " ", fg = "#8C8C8C" },

    # Audio / Video
    { ext = "mp3",     text = " ", fg = "#8C8C8C" },
    { ext = "flac",    text = " ", fg = "#8C8C8C" },
    { ext = "wav",     text = " ", fg = "#8C8C8C" },
    { ext = "mp4",     text = " ", fg = "#8C8C8C" },
    { ext = "mkv",     text = " ", fg = "#8C8C8C" },
    { ext = "webm",    text = " ", fg = "#8C8C8C" },

    # Fallback — everything else gets a plain file glyph, dim
    { name = "*",      text = " ", fg = "#4A4A4A" },
]
