# ── Glyph / Nothing OS — yazi theme ──────────────────────────────────────────
# Black bg · white text · single red accent (#D71921) · no color noise
# Palette roles (matches Theme.qml glyphDark):
#   bg    = #000000   s1    = #0E0E0E   s2 = #1A1A1A   s3 = #2A2A2A
#   mute  = #4A4A4A   grey  = #8C8C8C   fg = #F2F2F2
#   red   = #D71921

# ── Manager ───────────────────────────────────────────────────────────────────
[manager]
cwd                  = { fg = "#8C8C8C" }

# Hovered item
hovered              = { fg = "#F2F2F2", bg = "#1A1A1A", bold = true }
preview_hovered      = { underline = true }

# Find highlight
find_keyword         = { fg = "#D71921", bold = true }
find_position        = { fg = "#D71921", italic = true }

# Marked (selected) items
marker_selected      = { fg = "#D71921", bg = "#D71921" }
marker_copied        = { fg = "#8C8C8C", bg = "#8C8C8C" }
marker_cut           = { fg = "#4A4A4A", bg = "#4A4A4A" }

# Tab bar
tab_active           = { fg = "#F2F2F2", bg = "#1A1A1A", bold = true }
tab_inactive         = { fg = "#4A4A4A", bg = "#000000" }
tab_width            = 1

# Count badges (selected / yanked)
count_selected       = { fg = "#000000", bg = "#D71921", bold = true }
count_copied         = { fg = "#000000", bg = "#8C8C8C" }
count_cut            = { fg = "#000000", bg = "#4A4A4A" }

# Borders
border_symbol        = "│"
border_style         = { fg = "#2A2A2A" }

# ── Status bar ────────────────────────────────────────────────────────────────
[status]
separator_open       = ""
separator_close      = ""
separator_style      = { fg = "#1A1A1A", bg = "#1A1A1A" }

# Left section: mode pill
mode_normal          = { fg = "#000000", bg = "#F2F2F2", bold = true }
mode_select          = { fg = "#000000", bg = "#D71921", bold = true }
mode_unset           = { fg = "#000000", bg = "#4A4A4A", bold = true }

# Progress bar (file copy / move)
progress_label       = { fg = "#F2F2F2", bold = true }
progress_normal      = { fg = "#D71921", bg = "#2A2A2A" }
progress_error       = { fg = "#D71921", bg = "#2A2A2A" }

# Permissions
perm_type            = { fg = "#8C8C8C" }
perm_read            = { fg = "#F2F2F2" }
perm_write           = { fg = "#D71921" }
perm_exec            = { fg = "#8C8C8C" }
perm_sep             = { fg = "#2A2A2A" }

# ── Input box ─────────────────────────────────────────────────────────────────
[input]
cursor               = { fg = "#000000", bg = "#F2F2F2" }
title                = { fg = "#F2F2F2", bold = true }
value                = { fg = "#F2F2F2" }
selected             = { reversed = true }

# ── Completion popup ──────────────────────────────────────────────────────────
[completion]
border               = { fg = "#2A2A2A" }
active               = { fg = "#F2F2F2", bg = "#1A1A1A", bold = true }
inactive             = { fg = "#4A4A4A" }

# ── Tasks panel ───────────────────────────────────────────────────────────────
[tasks]
border               = { fg = "#2A2A2A" }
title                = { fg = "#F2F2F2", bold = true }
hovered              = { fg = "#F2F2F2", bg = "#1A1A1A", underline = true }

# ── Which-key popup ───────────────────────────────────────────────────────────
[which]
mask                 = { bg = "#000000" }
cand                 = { fg = "#F2F2F2" }
rest                 = { fg = "#4A4A4A" }
desc                 = { fg = "#8C8C8C" }
separator            = "  "
separator_style      = { fg = "#2A2A2A" }

# ── File search (via fd/rg) ───────────────────────────────────────────────────
[spot]
border               = { fg = "#2A2A2A" }
title                = { fg = "#F2F2F2", bold = true }
hovered              = { fg = "#F2F2F2", bg = "#1A1A1A", bold = true }

# ── Notify popups ─────────────────────────────────────────────────────────────
[notify]
title_info           = { fg = "#F2F2F2", bold = true }
title_warn           = { fg = "#8C8C8C", bold = true }
title_error          = { fg = "#D71921", bold = true }
icon_info            = ""
icon_warn            = ""
icon_error           = ""

# ── Help overlay ──────────────────────────────────────────────────────────────
[help]
on                   = { fg = "#D71921", bold = true }
exec                 = { fg = "#F2F2F2" }
desc                 = { fg = "#8C8C8C" }
hovered              = { fg = "#F2F2F2", bg = "#1A1A1A", bold = true }
footer               = { fg = "#4A4A4A", bg = "#000000" }

# ── File type coloring ────────────────────────────────────────────────────────
# Nothing OS: one accent, everything else near-monochrome.
# Directories bright white, executables red, media/archives grey, rest muted.
[filetype]
rules = [
    # Directories — bright, bold
    { name = "*/", fg = "#F2F2F2", bold = true },

    # Executables — red accent (the one live color)
    { name = "*", is = "exec", fg = "#D71921" },

    # Images
    { mime = "image/*", fg = "#8C8C8C" },

    # Audio / Video
    { mime = "{audio,video}/*", fg = "#8C8C8C" },

    # Archives / compressed
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#4A4A4A", bold = true },

    # Documents / PDFs
    { mime = "application/pdf",  fg = "#8C8C8C" },
    { mime = "text/*",           fg = "#F2F2F2" },

    # Symlinks
    { name = "*", is = "link",   fg = "#4A4A4A", italic = true },

    # Orphaned symlinks
    { name = "*", is = "orphan", fg = "#D71921", italic = true },

    # Hidden files (dotfiles)
    { name = ".*",               fg = "#4A4A4A" },

    # Fallback — everything else
    { name = "*",                fg = "#8C8C8C" },
]

# ── Icon theme ────────────────────────────────────────────────────────────────
# Minimal icon set — one glyph per category, all same grey (no color noise)
[icon]
rules = [
    # Directories
    { name = "*/", text = " ", fg = "#F2F2F2" },

    # Dotfiles / hidden
    { name = ".*", text = " ", fg = "#4A4A4A" },

    # Common dev files
    { name = "*.rs",     text = " ", fg = "#8C8C8C" },
    { name = "*.py",     text = " ", fg = "#8C8C8C" },
    { name = "*.js",     text = " ", fg = "#8C8C8C" },
    { name = "*.ts",     text = " ", fg = "#8C8C8C" },
    { name = "*.lua",    text = " ", fg = "#8C8C8C" },
    { name = "*.sh",     text = " ", fg = "#8C8C8C" },
    { name = "*.toml",   text = " ", fg = "#8C8C8C" },
    { name = "*.json",   text = " ", fg = "#8C8C8C" },
    { name = "*.yaml",   text = " ", fg = "#8C8C8C" },
    { name = "*.yml",    text = " ", fg = "#8C8C8C" },
    { name = "*.md",     text = " ", fg = "#8C8C8C" },
    { name = "*.txt",    text = " ", fg = "#8C8C8C" },
    { name = "*.pdf",    text = " ", fg = "#8C8C8C" },
    { name = "*.zip",    text = " ", fg = "#4A4A4A" },
    { name = "*.tar*",   text = " ", fg = "#4A4A4A" },
    { name = "*.gz",     text = " ", fg = "#4A4A4A" },
    { name = "*.7z",     text = " ", fg = "#4A4A4A" },
    { name = "*.rar",    text = " ", fg = "#4A4A4A" },
    # Images
    { name = "*.png",    text = " ", fg = "#8C8C8C" },
    { name = "*.jpg",    text = " ", fg = "#8C8C8C" },
    { name = "*.jpeg",   text = " ", fg = "#8C8C8C" },
    { name = "*.gif",    text = " ", fg = "#8C8C8C" },
    { name = "*.svg",    text = " ", fg = "#8C8C8C" },
    { name = "*.webp",   text = " ", fg = "#8C8C8C" },
    # Audio/Video
    { name = "*.mp3",    text = " ", fg = "#8C8C8C" },
    { name = "*.flac",   text = " ", fg = "#8C8C8C" },
    { name = "*.mp4",    text = " ", fg = "#8C8C8C" },
    { name = "*.mkv",    text = " ", fg = "#8C8C8C" },
    # Fallback
    { name = "*",        text = " ", fg = "#4A4A4A" },
]
