# demonshot: background Crypt, cursor — bone block, 16 colors from spec (blue/green only here)

font_family      JetBrainsMono Nerd Font
font_size 11.0

cursor_shape block
cursor_blink_interval 0
cursor_trail 4

background_opacity 1
window_padding_width 18 20
confirm_os_window_close 0
shell zsh

color0  #000000
color1  #FF4444
color2  #44FF44
color3  #FFAA00
color4  #4488FF
color5  #FF44FF
color6  #44FFFF
color7  #FFFFFF
color8  #666666
color9  #FF6666
color10 #66FF66
color11 #FFCC44
color12 #66AAFF
color13 #FF66FF
color14 #66FFFF
color15 #FFFFFF

# on top of everything above — live shell file: demonshot writes interface colors by house rules palette (Rules.qml),
# glyph — its own colors, 16 ANSI, font and padding (Theme.apply). Changed shell — file rewritten, kitty re-read
include ~/.config/demonshot/kitty.conf

# Copy
map ctrl+c    copy_or_interrupt

# Search (keep Ctrl+F free for TUI apps like cliamp/nvim; use Ctrl+Shift+F for kitty scrollback)
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
