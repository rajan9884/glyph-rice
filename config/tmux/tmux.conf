# Glyph Nothing OS theme for tmux

# Terminal capabilities (RGB truecolor + Kitty/Yazi graphics passthrough)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -g allow-passthrough on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar (pure black, white pills, crimson live marker)
set -g status-position bottom
set -g status-style "bg=#000000,fg=#F2F2F2"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[bg=#D71921,fg=#000000,bold] #S #[bg=#000000] "
set -g status-right "#{?client_prefix,#[bg=#F2F2F2]#[fg=#000000]#[bold] PREFIX #[bg=#000000] ,}#[fg=#8C8C8C] %H:%M "

# Window tabs
setw -g window-status-separator " "
setw -g window-status-format "#[bg=#0E0E0E,fg=#8C8C8C] #I:#W "
setw -g window-status-current-format "#[bg=#F2F2F2,fg=#000000,bold] #I:#W "
setw -g window-status-activity-style "bg=#1A1A1A,fg=#D71921"

# Pane borders & mode UI
set -g pane-border-style "fg=#2A2A2A"
set -g pane-active-border-style "fg=#F2F2F2"
set -g message-style "bg=#0E0E0E,fg=#F2F2F2,bold"
set -g message-command-style "bg=#0E0E0E,fg=#D71921,bold"
setw -g mode-style "bg=#F2F2F2,fg=#000000,bold"
