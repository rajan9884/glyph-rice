# glyph — foot terminal config
# Base colors (16 ANSI) from demonshot/kitty.conf spec; interface colors written
# by Theme.apply() into ~/.config/demonshot/foot.ini (included below), reloaded via SIGUSR1.

[main]
include=~/.config/demonshot/foot.ini
font=JetBrainsMono Nerd Font:size=11
pad=18x20
shell=zsh
dpi-aware=yes

[scrollback]
lines=10000
multiplier=5.0

[cursor]
style=beam
blink=no

[tweak]
font-monospace-warn=no

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+f

[colors-dark]
# Base 16 ANSI — bright palette (matches updated kitty.conf)
# Regular (0-7)
regular0=000000
regular1=FF4444
regular2=44FF44
regular3=FFAA00
regular4=4488FF
regular5=FF44FF
regular6=44FFFF
regular7=FFFFFF

# Bright (8-15)
bright0=666666
bright1=FF6666
bright2=66FF66
bright3=FFCC44
bright4=66AAFF
bright5=FF66FF
bright6=66FFFF
bright7=FFFFFF
