# glyph — foot terminal config
# Base colors (16 ANSI) from demonshot/kitty.conf spec; interface colors written
# by Theme.apply() into ~/.config/demonshot/foot.ini (included below), reloaded via SIGUSR1.

[main]
include=~/.config/demonshot/foot.ini
font=JetBrainsMono Nerd Font:size=11
pad=18x20
shell=zsh
dpi-aware=yes

[scrollback]
lines=10000
multiplier=5.0

[cursor]
style=block
blink=no

[tweak]
font-monospace-warn=no

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+f

[colors-dark]
# Base 16 ANSI — demonshot palette (matches kitty.conf colors)
# Regular (0-7)
regular0=1A1519
regular1=C7303D
regular2=7F9A84
regular3=C49A6C
regular4=6F7FB0
regular5=B8487A
regular6=6E9AA0
regular7=CFC4C3

# Bright (8-15)
bright0=4A3D45
bright1=E0525C
bright2=9DB8A2
bright3=DDB78B
bright4=8E9CC9
bright5=D46C9A
bright6=8FBAC0
bright7=E9DFDD
